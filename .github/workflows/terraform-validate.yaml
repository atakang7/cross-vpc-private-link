name: Infrastructure checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
      - name: OpenTofu format
        run: tofu fmt -check -recursive
      - name: Shell syntax
        run: |
          bash -n first-run.sh
          for script in scripts/*.sh; do bash -n "$script"; done

  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline integration smoke test
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        envdir: [envs/dev, envs/prod]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
      - name: Initialize without accessing AWS state
        working-directory: ${{ matrix.envdir }}
        run: tofu init -backend=false -input=false
      - name: Validate modules and stack
        working-directory: ${{ matrix.envdir }}
        run: tofu validate -no-color
