name: Infrastructure checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
      - name: OpenTofu format
        run: tofu fmt -check -recursive
      - name: Shell syntax
        run: |
          bash -n first-run.sh
          for script in scripts/*.sh; do bash -n "$script"; done

  sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline integration smoke test
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        envdir: [envs/dev, envs/prod]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
      - name: Initialize without accessing AWS state
        working-directory: ${{ matrix.envdir }}
        run: tofu init -backend=false -input=false -lockfile=readonly
      - name: Validate modules and stack
        working-directory: ${{ matrix.envdir }}
        run: tofu validate -no-color

  module-plan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
      - name: Initialize VPN module using the locked provider
        run: |
          cp envs/dev/.terraform.lock.hcl modules/client-vpn/.terraform.lock.hcl
          tofu -chdir=modules/client-vpn init -backend=false -lockfile=readonly -input=false
      - name: Validate VPN resource plans without AWS credentials
        run: tofu -chdir=modules/client-vpn test -no-color

  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate architectural SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse("img/architecture.svg").getroot()
          assert root.tag.endswith("svg")
          assert root.attrib.get("viewBox")
          assert root.attrib.get("aria-labelledby")
          print("Architecture diagram is valid and accessible.")
          PY
      - name: Render diagram in Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium)"
          "$CHROME" --headless --no-sandbox --disable-gpu \
            --window-size=1600,835 --screenshot="$RUNNER_TEMP/architecture.png" \
            "file://$GITHUB_WORKSPACE/img/architecture.svg"
          echo 'ARCH_DIAGRAM_PNG_BEGIN'
          base64 -w 0 "$RUNNER_TEMP/architecture.png"
          echo
          echo 'ARCH_DIAGRAM_PNG_END'
          cp "$RUNNER_TEMP/architecture.png" architecture-preview.png
      - name: Upload diagram rendering
        uses: actions/upload-artifact@v4
        with:
          name: architecture-preview
          path: architecture-preview.png
          retention-days: 14
